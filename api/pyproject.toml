[project]
name = "acorn-api"
version = "0.1.0"
description = "Acorn judge API: asks Jev and converts its answers into points"

authors = [
    { name = "sumire" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "pydantic>=2.14.1",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
